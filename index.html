<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>KRISHNA - Matka Results</title>
  <!-- Firebase SDKs -->
  <script type="module">
    // ============================================================
    // 🔥 FIREBASE CONFIGURATION - REPLACE WITH YOUR OWN CREDENTIALS
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyReplaceWithYourRealKey123456",
      authDomain: "your-project.firebaseapp.com",
      projectId: "your-project-id",
      storageBucket: "your-project.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:abcdef123456"
    };
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPhoneNumber, RecaptchaVerifier, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    let auth, db;
    let firebaseInitialized = false;
    
    try {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      firebaseInitialized = true;
    } catch (error) {
      console.error("Firebase error:", error);
    }
    
    let confirmationResult = null;
    let currentPhoneNumber = "";
    
    // DOM Elements
    const splashScreen = document.getElementById('splash-screen');
    const authContainer = document.getElementById('auth-container');
    const dashboardContainer = document.getElementById('dashboard-container');
    const loginCard = document.getElementById('login-card');
    const otpCard = document.getElementById('otp-card');
    const createAccountCard = document.getElementById('create-account-card');
    const phoneInput = document.getElementById('phone-number');
    const sendOtpBtn = document.getElementById('send-otp-btn');
    const otpInput = document.getElementById('otp-code');
    const verifyOtpBtn = document.getElementById('verify-otp-btn');
    const nameInput = document.getElementById('full-name');
    const cityInput = document.getElementById('city');
    const dobInput = document.getElementById('dob');
    const createAccountBtn = document.getElementById('create-account-btn');
    const backToLoginBtn = document.getElementById('back-to-login');
    const userWelcomeSpan = document.getElementById('user-welcome');
    const userCitySpan = document.getElementById('user-city-dob');
    const autoScrollDiv = document.getElementById('auto-scroll-markets');
    const autoScrollDashboard = document.getElementById('auto-scroll-markets-dashboard');
    
    // Market Data
    const marketItems = [
      { name: "SRIDEVI", digits: "124-71-560" },
      { name: "TIME BAZAR", digits: "123-62-570" },
      { name: "MILAN DAY", digits: "456-89-123" },
      { name: "KALYAN NIGHT", digits: "789-45-678" },
      { name: "RAJDHANI", digits: "234-90-345" },
      { name: "GALI", digits: "111-22-333" },
      { name: "DISAWAR", digits: "555-77-888" }
    ];
    
    function buildMarketHTML() {
      let html = '';
      for (let i = 0; i < 10; i++) {
        marketItems.forEach(item => {
          html += `
            <div class="market-card vibrate-on-scroll">
              <div class="market-name">${item.name}</div>
              <div class="market-digits">${item.digits}</div>
            </div>
          `;
        });
      }
      return html;
    }
    
    // Smooth auto-scrolling with vibration effect
    let scrollInterval = null;
    let currentScrollTop = 0;
    let isScrolling = true;
    let lastVibrateTime = 0;
    
    function triggerVibration() {
      const now = Date.now();
      if (now - lastVibrateTime > 150) {
        lastVibrateTime = now;
        const cards = document.querySelectorAll('.market-card');
        cards.forEach((card, index) => {
          if (Math.random() > 0.6) {
            card.style.transform = 'translateX(3px)';
            setTimeout(() => { if(card) card.style.transform = ''; }, 60);
          }
        });
      }
    }
    
    function startAutoScroll(container) {
      if (!container) return;
      if (scrollInterval) clearInterval(scrollInterval);
      
      container.scrollTop = 0;
      currentScrollTop = 0;
      container.innerHTML = buildMarketHTML();
      
      scrollInterval = setInterval(() => {
        if (!isScrolling || !container) return;
        
        const maxScroll = container.scrollHeight - container.clientHeight;
        if (currentScrollTop >= maxScroll) {
          currentScrollTop = 0;
          container.scrollTop = 0;
          triggerVibration();
        } else {
          currentScrollTop += 0.6;
          container.scrollTop = currentScrollTop;
          if (Math.random() > 0.92) triggerVibration();
        }
      }, 25);
    }
    
    function stopAutoScroll() {
      if (scrollInterval) {
        clearInterval(scrollInterval);
        scrollInterval = null;
      }
    }
    
    function bindScrollEvents(container) {
      if (!container) return;
      container.addEventListener('touchstart', () => { isScrolling = false; });
      container.addEventListener('touchend', () => { setTimeout(() => { isScrolling = true; }, 2000); });
      container.addEventListener('mousedown', () => { isScrolling = false; });
      container.addEventListener('mouseup', () => { setTimeout(() => { isScrolling = true; }, 2000); });
    }
    
    function showLoader(btn, isLoading, originalText) {
      if (isLoading) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Please wait...';
      } else {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }
    
    async function showDashboard(userId, userData) {
      authContainer.style.display = 'none';
      dashboardContainer.style.display = 'flex';
      userWelcomeSpan.innerText = userData.name || 'KRISHNA';
      userCitySpan.innerText = `${userData.city || 'City'} • ${userData.dob || 'DOB'}`;
      startAutoScroll(autoScrollDashboard);
      bindScrollEvents(autoScrollDashboard);
    }
    
    function demoLogin(phoneNumber) {
      const storedUsers = JSON.parse(localStorage.getItem('demoUsers') || '{}');
      const userData = storedUsers[phoneNumber];
      if (userData) {
        showDashboard(phoneNumber, userData);
      } else {
        loginCard.style.display = 'none';
        otpCard.style.display = 'none';
        createAccountCard.style.display = 'block';
        currentPhoneNumber = phoneNumber;
      }
    }
    
    function demoCreateAccount(name, city, dob) {
      const users = JSON.parse(localStorage.getItem('demoUsers') || '{}');
      users[currentPhoneNumber] = { name, city, dob, phone: currentPhoneNumber };
      localStorage.setItem('demoUsers', JSON.stringify(users));
      showDashboard(currentPhoneNumber, { name, city, dob });
    }
    
    if (verifyOtpBtn) {
      verifyOtpBtn.addEventListener('click', async () => {
        const code = otpInput.value.trim();
        if (!code) { alert("Please enter OTP"); return; }
        
        if (!firebaseInitialized) {
          if (code.length === 6) { demoLogin(currentPhoneNumber); alert("Login successful!"); }
          else { alert("Enter 6-digit OTP"); }
          return;
        }
        
        showLoader(verifyOtpBtn, true, "Verifying...");
        try {
          const result = await confirmationResult.confirm(code);
          const user = result.user;
          const userDocRef = doc(db, "users", user.uid);
          const docSnap = await getDoc(userDocRef);
          if (docSnap.exists()) {
            await showDashboard(user.uid, docSnap.data());
          } else {
            loginCard.style.display = 'none';
            otpCard.style.display = 'none';
            createAccountCard.style.display = 'block';
          }
        } catch (error) { alert("Invalid OTP: " + error.message); }
        finally { showLoader(verifyOtpBtn, false, "Verify OTP"); }
      });
    }
    
    if (sendOtpBtn) {
      sendOtpBtn.addEventListener('click', async () => {
        let rawPhone = phoneInput.value.trim();
        let digits = rawPhone.replace(/\D/g, '');
        if (digits.length !== 10) { alert("Please enter exactly 10 digits"); return; }
        const fullNumber = '+91' + digits;
        currentPhoneNumber = fullNumber;
        
        if (!firebaseInitialized) {
          alert("Demo Mode: Enter any 6-digit OTP");
          loginCard.style.display = 'none';
          otpCard.style.display = 'block';
          return;
        }
        
        showLoader(sendOtpBtn, true, "Sending OTP...");
        try {
          const recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });
          confirmationResult = await signInWithPhoneNumber(auth, fullNumber, recaptchaVerifier);
          alert("OTP sent!");
          loginCard.style.display = 'none';
          otpCard.style.display = 'block';
        } catch (error) { alert("Error: " + error.message); }
        finally { showLoader(sendOtpBtn, false, "Send OTP"); }
      });
    }
    
    if (createAccountBtn) {
      createAccountBtn.addEventListener('click', async () => {
        const name = nameInput.value.trim();
        const city = cityInput.value.trim();
        const dob = dobInput.value.trim();
        if (!name || !city || !dob) { alert("Please fill all fields"); return; }
        
        if (!firebaseInitialized) { demoCreateAccount(name, city, dob); return; }
        
        showLoader(createAccountBtn, true, "Creating...");
        try {
          const user = auth.currentUser;
          if (!user) throw new Error("No user");
          const userData = { name, city, dob, phone: currentPhoneNumber };
          await setDoc(doc(db, "users", user.uid), userData);
          await showDashboard(user.uid, userData);
        } catch (error) { alert("Failed: " + error.message); }
        finally { showLoader(createAccountBtn, false, "Create Account"); }
      });
    }
    
    if (backToLoginBtn) {
      backToLoginBtn.addEventListener('click', () => {
        createAccountCard.style.display = 'none';
        loginCard.style.display = 'block';
        otpCard.style.display = 'none';
        otpInput.value = '';
      });
    }
    
    if (firebaseInitialized) {
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          const userDocRef = doc(db, "users", user.uid);
          const docSnap = await getDoc(userDocRef);
          if (docSnap.exists() && dashboardContainer.style.display !== 'flex') {
            await showDashboard(user.uid, docSnap.data());
          } else if (!docSnap.exists() && authContainer.style.display !== 'none') {
            loginCard.style.display = 'none';
            otpCard.style.display = 'none';
            createAccountCard.style.display = 'block';
          }
        } else {
          if (dashboardContainer.style.display === 'flex') dashboardContainer.style.display = 'none';
          authContainer.style.display = 'flex';
          loginCard.style.display = 'block';
          otpCard.style.display = 'none';
          createAccountCard.style.display = 'none';
          phoneInput.value = '';
          otpInput.value = '';
          startAutoScroll(autoScrollDiv);
          bindScrollEvents(autoScrollDiv);
        }
      });
    }
    
    setTimeout(() => {
      splashScreen.style.display = 'none';
      authContainer.style.display = 'flex';
      startAutoScroll(autoScrollDiv);
      bindScrollEvents(autoScrollDiv);
    }, 1500);
    
    if (phoneInput) {
      phoneInput.addEventListener('input', function(e) {
        this.value = this.value.replace(/\D/g, '').slice(0, 10);
      });
    }
    if (otpInput) {
      otpInput.addEventListener('input', function(e) {
        this.value = this.value.replace(/\D/g, '').slice(0, 6);
      });
    }
  </script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: 'Segoe UI', 'Poppins', 'Roboto', sans-serif;
      background: #0a0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    
    .app-container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      background: #f8fafc;

      display: flex;
      flex-direction: column;

    /* Splash Screen */
    #splash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0b3b5f, #1b4f8b);
      z-index: 200;
      display: flex;
      align-items: center;

      flex-direction: column;
      color: white;
      animation: fadeOut 0.8s ease-in-out 1.2s forwards;
    }
    
    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }
    
    .splash-title {
      font-size: 3.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      animation: bounceText 0.6s ease-out;
    }
    
    @keyframes bounceText {
      0% { transform: scale(0.8); opacity: 0; }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    
    /* Auth Container */
    #auth-container {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: #ffffff;
    }
    
    /* Top half - Blue background, KRISHNA at top */
    .top-half-blue {
      flex: 0 0 48%;
      background: linear-gradient(145deg, #1e4b8f, #0d355c);
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 15px 20px 25px 20px;
      z-index: 2;

    /* KRISHNA headline at top */
    .headline-top {

    }

    @keyframes glowPulse {
      0% { text-shadow: 0 0 0px rgba(255,255,200,0.5); transform: scale(1);}
      50% { text-shadow: 0 0 15px rgba(255,245,150,0.9); transform: scale(1.02);}
      100% { text-shadow: 0 0 0px rgba(255,255,200,0.5); transform: scale(1);}

    .sub-brand-main {

    /* Form Card Wrapper */
    .form-card-wrapper {
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
    }
    .card-glass {
      background: rgba(255,255,255,0.96);

    .input-group {
      margin-bottom: 14px;
    }

      display: flex;

    }
    .phone-prefix {
      padding-left: 16px;

      background: #0d355c;

      padding: 12px;
      border: none;
      border-radius: 40px;

      font-size: 1rem;
      cursor: pointer;

    }
    .btn-primary:active { transform: scale(0.97); background: #1e4b8f;}
    .text-link {
      text-align: center;
      margin-top: 14px;
      font-size: 0.8rem;
      color: #0d355c;
      font-weight: 500;
      cursor: pointer;
    }
    
    /* ============================================ */
    /* MIDDLE BLUE CURVE - EXACTLY LIKE REFERENCE IMAGE */
    /* ============================================ */
    .curve-container {
      position: relative;
      background: #f1f5f9;
      height: 35px;
      margin-top: -8px;
      z-index: 5;
    }
    
    .blue-curve {
      position: absolute;
      top: -25px;
      left: 0;
      width: 100%;
      height: 50px;
      background: #f1f5f9;
      border-radius: 50% 50% 0 0;
      z-index: 3;
    }
    
    /* Alternative approach: curve that looks like the image */
    .bottom-half-scroll {
      flex: 1;
      overflow: hidden;
      background: #f1f5f9;
      position: relative;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
      margin-top: 0;
      z-index: 1;
    }
    
    /* The upward curve effect - like the blue curve in your image */
    .bottom-half-scroll::before {
      content: '';
      position: absolute;
      top: -28px;
      left: 0;
      width: 100%;
      height: 45px;
      background: #f1f5f9;
      border-radius: 50% 50% 0 0;
      z-index: 2;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
    }
    
    /* Extra decorative curve line to match image style */
    .curve-accent {
      position: absolute;
      top: -30px;
      left: 0;
      width: 100%;
      height: 8px;
      background: linear-gradient(90deg, #3b82f6, #60a5fa, #3b82f6);
      border-radius: 10px 10px 0 0;
      z-index: 3;
      opacity: 0.5;
    }
    
    /* Scroll container */
    .scroll-container {
      height: 100%;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 28px 14px 16px 14px;
      scrollbar-width: thin;
    }
    .scroll-container::-webkit-scrollbar {
      width: 2px;
    }
    
    /* Market Cards with vibration animation */
    .market-card {
      background: white;
      border-radius: 22px;
      padding: 14px 16px;
      margin-bottom: 12px;
      text-align: center;

      border: 1px solid #e2e8f0;
      transition: all 0.05s ease;
      animation: cardGlow 2s infinite alternate;
    }
    
    @keyframes cardGlow {
      0% { box-shadow: 0 3px 12px rgba(0,0,0,0.08); }
      100% { box-shadow: 0 5px 18px rgba(37,99,235,0.15); }

    .vibrate-on-scroll {
      transition: transform 0.03s linear;

    .market-name {
      font-weight: 800;
      font-size: 1.2rem;
      color: #0f172a;
      text-align: center;
      letter-spacing: 1px;
    }
    .market-digits {
      font-family: 'Courier New', monospace;
      font-size: 1.35rem;

      color: #2563eb;

      margin-top: 6px;
      letter-spacing: 2px;
    }
    
    /* Dashboard styles with same curve */
    #dashboard-container {
      display: none;
      flex-direction: column;
      height: 100%;
      background: #f1f5f9;

      display: flex;
      flex-direction: column;
      justify-content: center;
      color: white;

      font-size: 1.6rem;
      font-weight: 700;
      animation: fadeSlide 0.5s ease;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .city-dob-text {
      margin-top: 8px;
      opacity: 0.85;
      font-size: 0.85rem;
    }
    .dashboard-bottom-scroll {
      flex: 1;
      overflow: hidden;
      position: relative;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
      margin-top: 0;
      background: #f1f5f9;
    }
    .dashboard-bottom-scroll::before {
      content: '';
      position: absolute;
      top: -28px;
      left: 0;
      width: 100%;
      height: 45px;
      background: #f1f5f9;
      border-radius: 50% 50% 0 0;
      z-index: 2;
    }
    .dashboard-bottom-scroll .scroll-container {
      padding-top: 28px;
    }
    
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* OTP/Create Account card styles */
    .card-glass h3 {
      font-size: 1.3rem;
      color: #0d355c;
      margin-bottom: 12px;
      text-align: center;
    }
    .input-group label {
      font-size: 0.7rem;
      font-weight: 600;
      color: #334155;
      display: block;
      margin-bottom: 4px;
    }
    .input-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 28px;
      font-size: 0.9rem;
      background: white;
    }
    
    @media (max-width: 480px) {
      .brand-name-main { font-size: 2.3rem; }
      .market-digits { font-size: 1.1rem; }
      .card-glass { padding: 14px; }
      .top-half-blue { padding: 12px 20px 20px 20px; }
    }
  </style>

<body>
<div class="app-container">
  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-title">KRISHNA</div>
    <div style="margin-top: 8px; font-size: 0.8rem;">MATKA RESULTS</div>
  </div>
  
  <!-- Authentication Container -->
  <div id="auth-container">
    <!-- Top half: Blue background, KRISHNA at very top -->
    <div class="top-half-blue">
      <div class="headline-top">
        <div class="brand-name-main">KRISHNA</div>
        <div class="sub-brand-main">OFFICIAL MATKA</div>
      </div>
      <div class="form-card-wrapper">
        <!-- Login Card - Clean without extra labels -->
        <div id="login-card" class="card-glass">
          <div class="input-group">
            <div class="phone-prefix-wrapper">
              <span class="phone-prefix">+91</span>
              <input type="tel" id="phone-number" placeholder="9876543210" maxlength="10" inputmode="numeric">
            </div>
          </div>
          <button id="send-otp-btn" class="btn-primary">Send OTP</button>
        </div>
        
        <!-- OTP Card -->
        <div id="otp-card" class="card-glass" style="display: none;">
          <h3>Verify OTP</h3>
          <div class="input-group">
            <input type="text" id="otp-code" placeholder="Enter 6-digit code" maxlength="6" inputmode="numeric">
          </div>
          <button id="verify-otp-btn" class="btn-primary">Verify & Login</button>
        </div>
        
        <!-- Create Account Card -->
        <div id="create-account-card" class="card-glass" style="display: none;">
          <h3>Create Account</h3>
          <div class="input-group"><input type="text" id="full-name" placeholder="Full Name"></div>
          <div class="input-group"><input type="text" id="city" placeholder="City"></div>
          <div class="input-group"><input type="date" id="dob" placeholder="Date of Birth"></div>
          <button id="create-account-btn" class="btn-primary">Complete Signup</button>
          <div id="back-to-login" class="text-link">← Back to Login</div>
        </div>
      </div>
    </div>
    
    <!-- Blue Curve Accent - exactly like reference image -->
    <div class="curve-container">
      <div class="blue-curve"></div>
      <div class="curve-accent"></div>
    </div>
    
    <!-- Bottom half: Auto scrolling markets -->
    <div class="bottom-half-scroll">
      <div id="auto-scroll-markets" class="scroll-container"></div>
