<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>KRISHNA - Satta Matka App</title>
  <!-- Firebase SDKs -->
  <script type="module">
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPhoneNumber, RecaptchaVerifier, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ========== 🔥 REPLACE WITH YOUR FIREBASE CONFIG ==========
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Global variables
    let confirmationResult = null;
    let currentPhoneNumber = "";

    // DOM Elements
    const splashScreen = document.getElementById('splash-screen');
    const authContainer = document.getElementById('auth-container');
    const dashboardContainer = document.getElementById('dashboard-container');
    const loginCard = document.getElementById('login-card');
    const otpCard = document.getElementById('otp-card');
    const createAccountCard = document.getElementById('create-account-card');
    const phoneInput = document.getElementById('phone-number');
    const sendOtpBtn = document.getElementById('send-otp-btn');
    const otpInput = document.getElementById('otp-code');
    const verifyOtpBtn = document.getElementById('verify-otp-btn');
    const nameInput = document.getElementById('full-name');
    const cityInput = document.getElementById('city');
    const dobInput = document.getElementById('dob');
    const createAccountBtn = document.getElementById('create-account-btn');
    const backToLoginBtn = document.getElementById('back-to-login');
    const userWelcomeSpan = document.getElementById('user-welcome');
    const userCitySpan = document.getElementById('user-city-dob');
    const autoScrollDiv = document.getElementById('auto-scroll-markets');
    const autoScrollDashboard = document.getElementById('auto-scroll-markets-dashboard');

    // Market Data (repeated for infinite scroll effect)
    const marketItems = [
      { name: "SRIDEVI", digits: "124-71-560" },
      { name: "TIME BAZAR", digits: "123-62-570" },
      { name: "MILAN DAY", digits: "456-89-123" },
      { name: "KALYAN NIGHT", digits: "789-45-678" },
      { name: "RAJDHANI", digits: "234-90-345" },
      { name: "GALI DISAWAR", digits: "111-22-333" },
      { name: "SRIDEVI", digits: "124-71-560" },
      { name: "TIME BAZAR", digits: "123-62-570" }
    ];

    // Create repeating content for smooth infinite scroll
    function buildMarketHTML() {
      let html = '';
      // Repeat 5 times to create seamless loop
      for (let i = 0; i < 5; i++) {
        marketItems.forEach(item => {
          html += `
            <div class="market-card">
              <div class="market-name">${item.name}</div>
              <div class="market-digits">${item.digits}</div>
            </div>
          `;
        });
      }
      return html;
    }

    // Setup auto-scrolling with smooth animation
    let scrollInterval;
    let currentScrollTop = 0;
    let isScrolling = true;

    function startAutoScroll(container) {
      if (!container) return;
      // Clear any existing interval
      if (scrollInterval) clearInterval(scrollInterval);
      
      // Reset scroll position to 0
      container.scrollTop = 0;
      currentScrollTop = 0;
      
      // Fill content
      container.innerHTML = buildMarketHTML();
      
      // Smooth auto-scroll: move 1px every 30ms (slow and smooth)
      scrollInterval = setInterval(() => {
        if (!isScrolling) return;
        if (!container) return;
        
        // Get max scroll height
        const maxScroll = container.scrollHeight - container.clientHeight;
        
        if (currentScrollTop >= maxScroll) {
          // Seamless reset to top without jump
          currentScrollTop = 0;
          container.scrollTop = 0;
        } else {
          currentScrollTop += 0.8; // Smooth slow speed
          container.scrollTop = currentScrollTop;
        }
      }, 30);
    }

    function stopAutoScroll() {
      if (scrollInterval) {
        clearInterval(scrollInterval);
        scrollInterval = null;
      }
    }

    // Pause on user interaction
    function bindScrollEvents(container) {
      if (!container) return;
      container.addEventListener('touchstart', () => { isScrolling = false; });
      container.addEventListener('touchend', () => { setTimeout(() => { isScrolling = true; }, 3000); });
      container.addEventListener('mousedown', () => { isScrolling = false; });
      container.addEventListener('mouseup', () => { setTimeout(() => { isScrolling = true; }, 3000); });
    }

    // Helper: Show loader
    function showLoader(btn, isLoading, originalText) {
      if (isLoading) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Please wait...';
      } else {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    // Show Dashboard
    async function showDashboard(userId, userData) {
      authContainer.style.display = 'none';
      dashboardContainer.style.display = 'flex';
      userWelcomeSpan.innerText = userData.name || 'KRISHNA';
      userCitySpan.innerText = `${userData.city || 'City'} • ${userData.dob || 'DOB'}`;
      // Start auto-scroll for dashboard
      startAutoScroll(autoScrollDashboard);
      bindScrollEvents(autoScrollDashboard);
    }

    // Verify OTP
    verifyOtpBtn.addEventListener('click', async () => {
      const code = otpInput.value.trim();
      if (!code) {
        alert("Please enter OTP");
        return;
      }
      showLoader(verifyOtpBtn, true, "Verifying...");
      try {
        const result = await confirmationResult.confirm(code);
        const user = result.user;
        const userDocRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(userDocRef);
        
        if (docSnap.exists()) {
          await showDashboard(user.uid, docSnap.data());
        } else {
          loginCard.style.display = 'none';
          otpCard.style.display = 'none';
          createAccountCard.style.display = 'block';
        }
      } catch (error) {
        alert("Invalid OTP: " + error.message);
      } finally {
        showLoader(verifyOtpBtn, false, "Verify OTP");
      }
    });

    // Send OTP with +91 prefix & 10 digit validation
    sendOtpBtn.addEventListener('click', async () => {
      let rawPhone = phoneInput.value.trim();
      // Remove any non-digit
      let digits = rawPhone.replace(/\D/g, '');
      if (digits.length !== 10) {
        alert("Please enter exactly 10 digits (e.g., 9876543210)");
        return;
      }
      const fullNumber = '+91' + digits;
      currentPhoneNumber = fullNumber;
      
      showLoader(sendOtpBtn, true, "Sending OTP...");
      try {
        const recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });
        confirmationResult = await signInWithPhoneNumber(auth, fullNumber, recaptchaVerifier);
        alert("OTP sent successfully!");
        loginCard.style.display = 'none';
        otpCard.style.display = 'block';
      } catch (error) {
        alert("Error: " + error.message);
      } finally {
        showLoader(sendOtpBtn, false, "Send OTP");
      }
    });

    // Create Account
    createAccountBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      const city = cityInput.value.trim();
      const dob = dobInput.value.trim();
      if (!name || !city || !dob) {
        alert("Please fill all fields");
        return;
      }
      showLoader(createAccountBtn, true, "Creating...");
      try {
        const user = auth.currentUser;
        if (!user) throw new Error("No user");
        const userData = { name, city, dob, phone: currentPhoneNumber, createdAt: new Date().toISOString() };
        await setDoc(doc(db, "users", user.uid), userData);
        await showDashboard(user.uid, userData);
      } catch (error) {
        alert("Failed: " + error.message);
      } finally {
        showLoader(createAccountBtn, false, "Create Account");
      }
    });

    backToLoginBtn.addEventListener('click', () => {
      createAccountCard.style.display = 'none';
      loginCard.style.display = 'block';
      otpCard.style.display = 'none';
      otpInput.value = '';
    });

    // Auth State Listener
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userDocRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(userDocRef);
        if (docSnap.exists() && dashboardContainer.style.display !== 'flex') {
          await showDashboard(user.uid, docSnap.data());
        } else if (!docSnap.exists() && authContainer.style.display !== 'none') {
          if (loginCard.style.display !== 'none') {
            loginCard.style.display = 'none';
            otpCard.style.display = 'none';
            createAccountCard.style.display = 'block';
          }
        }
      } else {
        if (dashboardContainer.style.display === 'flex') dashboardContainer.style.display = 'none';
        authContainer.style.display = 'flex';
        loginCard.style.display = 'block';
        otpCard.style.display = 'none';
        createAccountCard.style.display = 'none';
        phoneInput.value = '';
        otpInput.value = '';
        // Restart auto-scroll for auth bottom section
        startAutoScroll(autoScrollDiv);
        bindScrollEvents(autoScrollDiv);
      }
    });

    // Initial Splash + start auto-scroll on auth screen
    setTimeout(() => {
      splashScreen.style.display = 'none';
      authContainer.style.display = 'flex';
      startAutoScroll(autoScrollDiv);
      bindScrollEvents(autoScrollDiv);
    }, 1500);
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', 'Roboto', sans-serif;
      background: #0a0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Mobile container like Android app */
    .app-container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      background: #f8fafc;
      box-shadow: 0 0 40px rgba(0,0,0,0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border-radius: 0;
    }

    /* Splash Screen with animation */
    #splash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0b3b5f, #1b4f8b);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      animation: fadeOut 0.8s ease-in-out 1.2s forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    .splash-title {
      font-size: 3.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.2);
      animation: bounceText 0.6s ease-out;
    }

    @keyframes bounceText {
      0% { transform: scale(0.8); opacity: 0; }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Auth Container - split design with blue top and curved divider */
    #auth-container {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: #ffffff;
    }

    /* Top half - Blue Gradient Background */
    .top-half-blue {
      flex: 0 0 50%;
      background: linear-gradient(145deg, #1e4b8f, #0d355c);
      border-bottom-left-radius: 48px;
      border-bottom-right-radius: 48px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.1);
      z-index: 2;
    }

    /* Animated KRISHNA name top center */
    .brand-animation {
      text-align: center;
      margin-bottom: 20px;
    }
    .brand-name {
      font-size: 2.5rem;
      font-weight: 800;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      letter-spacing: 3px;
      animation: glowPulse 1.8s infinite ease-in-out;
    }
    @keyframes glowPulse {
      0% { text-shadow: 0 0 0px rgba(255,255,200,0.5); transform: scale(1);}
      50% { text-shadow: 0 0 12px rgba(255,245,150,0.9); transform: scale(1.02);}
      100% { text-shadow: 0 0 0px rgba(255,255,200,0.5); transform: scale(1);}
    }
    .sub-brand {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.8);
      letter-spacing: 1px;
    }

    /* Cards Container Inside Top Half */
    .form-card-wrapper {
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }
    .card-glass {
      background: rgba(255,255,255,0.95);
      border-radius: 32px;
      padding: 20px 18px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.2);
      backdrop-filter: blur(2px);
    }
    .card-glass h3 {
      font-size: 1.4rem;
      color: #0d355c;
      margin-bottom: 6px;
    }
    .input-group {
      margin-bottom: 15px;
    }
    .input-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #334155;
      display: block;
      margin-bottom: 5px;
    }
    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 28px;
      font-size: 0.95rem;
      background: white;
    }
    .input-group input:focus {
      outline: none;
      border-color: #1e4b8f;
      box-shadow: 0 0 0 3px rgba(30,75,143,0.2);
    }
    .btn-primary {
      background: #0d355c;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 8px;
    }
    .btn-primary:active { transform: scale(0.97); background: #1e4b8f;}
    .text-link {
      text-align: center;
      margin-top: 16px;
      font-size: 0.8rem;
      color: #0d355c;
      font-weight: 500;
      cursor: pointer;
    }

    /* Bottom half - Auto scroll markets */
    .bottom-half-scroll {
      flex: 1;
      overflow: hidden;
      background: #f1f5f9;
      position: relative;
    }
    .scroll-container {
      height: 100%;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 16px 12px;
      /* Hide scrollbar for cleaner look */
      scrollbar-width: thin;
    }
    .scroll-container::-webkit-scrollbar {
      width: 3px;
    }
    .market-card {
      background: white;
      border-radius: 20px;
      padding: 14px 16px;
      margin-bottom: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      border: 1px solid #e2e8f0;
      transition: all 0.1s;
    }
    .market-name {
      font-weight: 800;
      font-size: 1.2rem;
      color: #0f172a;
      text-align: center;
      letter-spacing: 1px;
    }
    .market-digits {
      font-family: 'Courier New', monospace;
      font-size: 1.35rem;
      font-weight: 700;
      color: #2563eb;
      text-align: center;
      margin-top: 6px;
      letter-spacing: 1.5px;
    }

    /* Dashboard style - similar split with blue gradient */
    #dashboard-container {
      display: none;
      flex-direction: column;
      height: 100%;
      background: #f1f5f9;
    }
    .dashboard-top-blue {
      flex: 0 0 45%;
      background: linear-gradient(145deg, #1e4b8f, #0d355c);
      border-bottom-left-radius: 48px;
      border-bottom-right-radius: 48px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: white;
    }
    .welcome-text {
      font-size: 1.8rem;
      font-weight: 700;
      animation: fadeSlide 0.5s ease;
    }
    .city-dob-text {
      margin-top: 8px;
      opacity: 0.85;
      font-size: 0.9rem;
    }
    .dashboard-bottom-scroll {
      flex: 1;
      overflow: hidden;
      padding: 16px 12px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Curved divider effect via border radius already */
    @media (max-width: 480px) {
      .brand-name { font-size: 2rem; }
      .card-glass { padding: 16px; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-title">KRISHNA</div>
    <div style="margin-top: 10px; font-size: 0.9rem;">MATKA RESULTS</div>
  </div>

  <!-- Authentication Container: Blue top half + scrolling bottom -->
  <div id="auth-container">
    <!-- Top half: Blue background, curved bottom, KRISHNA animation + login/OTP forms -->
    <div class="top-half-blue">
      <div class="brand-animation">
        <div class="brand-name">KRISHNA</div>
        <div class="sub-brand">OFFICIAL MATKA</div>
      </div>
      <div class="form-card-wrapper">
        <!-- Login Card (Phone input) -->
        <div id="login-card" class="card-glass">
          <h3 style="text-align:center;">Mobile Login</h3>
          <div class="input-group">
            <label>📞 Phone Number (+91 auto)</label>
            <div style="display: flex; align-items: center; background: white; border-radius: 28px; border:1px solid #cbd5e1;">
              <span style="padding-left: 16px; font-weight: bold; background: #f1f5f9; border-radius: 28px 0 0 28px; padding: 12px 8px;">+91</span>
              <input type="tel" id="phone-number" placeholder="9876543210" style="border: none; flex:1; border-radius: 28px;" maxlength="10" inputmode="numeric">
            </div>
          </div>
          <button id="send-otp-btn" class="btn-primary">Send OTP</button>
        </div>

        <!-- OTP Card -->
        <div id="otp-card" class="card-glass" style="display: none;">
          <h3 style="text-align:center;">Verify OTP</h3>
          <div class="input-group">
            <label>🔐 6-digit Code</label>
            <input type="text" id="otp-code" placeholder="123456" maxlength="6">
          </div>
          <button id="verify-otp-btn" class="btn-primary">Verify & Login</button>
        </div>

        <!-- Create Account Card -->
        <div id="create-account-card" class="card-glass" style="display: none;">
          <h3 style="text-align:center;">Create Account</h3>
          <div class="input-group"><label>Full Name</label><input type="text" id="full-name" placeholder="Krishna Kumar"></div>
          <div class="input-group"><label>City</label><input type="text" id="city" placeholder="Mumbai"></div>
          <div class="input-group"><label>Date of Birth</label><input type="date" id="dob"></div>
          <button id="create-account-btn" class="btn-primary">Complete Signup</button>
          <div id="back-to-login" class="text-link">← Back to Login</div>
        </div>
      </div>
    </div>

    <!-- Bottom half: AUTO SCROLLING MARKET RESULTS (repeated, smooth & slow) -->
    <div class="bottom-half-scroll">
      <div id="auto-scroll-markets" class="scroll-container"></div>
    </div>
  </div>

  <!-- Dashboard Container (after login) -->
  <div id="dashboard-container">
    <div class="dashboard-top-blue">
      <div class="welcome-text" id="user-welcome">Welcome, KRISHNA</div>
      <div class="city-dob-text" id="user-city-dob">City • DOB</div>
    </div>
    <div class="dashboard-bottom-scroll">
      <div id="auto-scroll-markets-dashboard" class="scroll-container"></div>
    </div>
  </div>
  <div id="recaptcha-container"></div>
</div>

<script type="module">
  // Additional ensure that auto-scrolling works perfectly after dashboard
  // Already handled in main module, but re-run if needed
  import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  // This script just ensures that the dashboard market container gets same treatment
  window.addEventListener('load', () => {
    const authDiv = document.getElementById('auto-scroll-markets');
    if(authDiv && authDiv.children.length === 0) {
      // fallback fill
      const mkts = ['SRIDEVI','TIME BAZAR','MILAN DAY','KALYAN NIGHT','RAJDHANI'];
      const digitsList = ['124-71-560','123-62-570','456-89-123','789-45-678','234-90-345'];
      let html = '';
      for(let i=0;i<20;i++){
        let idx = i%5;
        html += `<div class="market-card"><div class="market-name">${mkts[idx]}</div><div class="market-digits">${digitsList[idx]}</div></div>`;
      }
      if(authDiv) authDiv.innerHTML = html;
      const dashDiv = document.getElementById('auto-scroll-markets-dashboard');
      if(dashDiv && dashDiv.children.length===0) dashDiv.innerHTML = html;
    }
  });
</script>
</body>
</html>
