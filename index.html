<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>KRISHNA - Matka Results</title>
  <!-- Firebase SDKs -->
  <script type="module">
    // ============================================================
    // 🔥 FIREBASE CONFIGURATION - REPLACE WITH YOUR OWN CREDENTIALS
    // ============================================================
    // IMPORTANT: Get these from your Firebase Console
    // 1. Go to https://console.firebase.google.com/
    // 2. Create or select your project
    // 3. Click on web app (</>) icon
    // 4. Copy the config object below
    // 5. Enable Phone Authentication in Firebase Console
    // 6. Enable Firestore Database
    
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyReplaceWithYourRealKey123456",
      authDomain: "your-project.firebaseapp.com",
      projectId: "your-project-id",
      storageBucket: "your-project.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:abcdef123456"
    };
    
    // NOTE: The above is a placeholder. You MUST replace with actual Firebase config.
    // For testing without Firebase, uncomment the demo mode section below.
    // ============================================================
    
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPhoneNumber, RecaptchaVerifier, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    // Initialize Firebase with error handling
    let auth, db;
    let firebaseInitialized = false;
    
    try {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      firebaseInitialized = true;
      console.log("Firebase initialized successfully");
    } catch (error) {
      console.error("Firebase initialization error:", error);
      // Show demo mode message
      const splash = document.getElementById('splash-screen');
      if (splash) {
        const errorMsg = document.createElement('div');
        errorMsg.style.cssText = 'position:absolute; bottom:20px; font-size:11px; color:#ffcccc; text-align:center;';
        errorMsg.innerHTML = '⚠️ Firebase not configured. Using demo mode.<br>Replace apiKey in firebaseConfig.';
        splash.appendChild(errorMsg);
      }
    }
    
    // Global variables
    let confirmationResult = null;
    let currentPhoneNumber = "";
    
    // DOM Elements
    const splashScreen = document.getElementById('splash-screen');
    const authContainer = document.getElementById('auth-container');
    const dashboardContainer = document.getElementById('dashboard-container');
    const loginCard = document.getElementById('login-card');
    const otpCard = document.getElementById('otp-card');
    const createAccountCard = document.getElementById('create-account-card');
    const phoneInput = document.getElementById('phone-number');
    const sendOtpBtn = document.getElementById('send-otp-btn');
    const otpInput = document.getElementById('otp-code');
    const verifyOtpBtn = document.getElementById('verify-otp-btn');
    const nameInput = document.getElementById('full-name');
    const cityInput = document.getElementById('city');
    const dobInput = document.getElementById('dob');
    const createAccountBtn = document.getElementById('create-account-btn');
    const backToLoginBtn = document.getElementById('back-to-login');
    const userWelcomeSpan = document.getElementById('user-welcome');
    const userCitySpan = document.getElementById('user-city-dob');
    const autoScrollDiv = document.getElementById('auto-scroll-markets');
    const autoScrollDashboard = document.getElementById('auto-scroll-markets-dashboard');
    
    // Market Data (repeated for infinite scroll effect)
    const marketItems = [
      { name: "SRIDEVI", digits: "124-71-560" },
      { name: "TIME BAZAR", digits: "123-62-570" },
      { name: "MILAN DAY", digits: "456-89-123" },
      { name: "KALYAN NIGHT", digits: "789-45-678" },
      { name: "RAJDHANI", digits: "234-90-345" },
      { name: "GALI", digits: "111-22-333" },
      { name: "DISAWAR", digits: "555-77-888" }
    ];
    
    // Create repeating content for smooth infinite scroll
    function buildMarketHTML() {
      let html = '';
      // Repeat many times for seamless loop
      for (let i = 0; i < 8; i++) {
        marketItems.forEach(item => {
          html += `
            <div class="market-card">
              <div class="market-name">${item.name}</div>
              <div class="market-digits">${item.digits}</div>
            </div>
          `;
        });
      }
      return html;
    }
    
    // Auto-scrolling with smooth animation
    let scrollInterval = null;
    let currentScrollTop = 0;
    let isScrolling = true;
    
    function startAutoScroll(container) {
      if (!container) return;
      if (scrollInterval) clearInterval(scrollInterval);
      
      container.scrollTop = 0;
      currentScrollTop = 0;
      container.innerHTML = buildMarketHTML();
      
      scrollInterval = setInterval(() => {
        if (!isScrolling || !container) return;
        
        const maxScroll = container.scrollHeight - container.clientHeight;
        if (currentScrollTop >= maxScroll) {
          currentScrollTop = 0;
          container.scrollTop = 0;
        } else {
          currentScrollTop += 0.6; // Smooth slow speed
          container.scrollTop = currentScrollTop;
        }
      }, 30);
    }
    
    function stopAutoScroll() {
      if (scrollInterval) {
        clearInterval(scrollInterval);
        scrollInterval = null;
      }
    }
    
    // Pause scrolling on user interaction
    function bindScrollEvents(container) {
      if (!container) return;
      container.addEventListener('touchstart', () => { isScrolling = false; });
      container.addEventListener('touchend', () => { setTimeout(() => { isScrolling = true; }, 3000); });
      container.addEventListener('mousedown', () => { isScrolling = false; });
      container.addEventListener('mouseup', () => { setTimeout(() => { isScrolling = true; }, 3000); });
    }
    
    // Helper: Show loader
    function showLoader(btn, isLoading, originalText) {
      if (isLoading) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Please wait...';
      } else {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }
    
    // Demo mode - store user in localStorage
    let demoUser = null;
    
    // Show Dashboard
    async function showDashboard(userId, userData) {
      authContainer.style.display = 'none';
      dashboardContainer.style.display = 'flex';
      userWelcomeSpan.innerText = userData.name || 'KRISHNA';
      userCitySpan.innerText = `${userData.city || 'City'} • ${userData.dob || 'DOB'}`;
      startAutoScroll(autoScrollDashboard);
      bindScrollEvents(autoScrollDashboard);
    }
    
    // Demo mode login function (when Firebase fails)
    function demoLogin(phoneNumber) {
      // Check if user exists in localStorage
      const storedUsers = JSON.parse(localStorage.getItem('demoUsers') || '{}');
      const userData = storedUsers[phoneNumber];
      
      if (userData) {
        // Existing user
        showDashboard(phoneNumber, userData);
      } else {
        // New user - show create account
        loginCard.style.display = 'none';
        otpCard.style.display = 'none';
        createAccountCard.style.display = 'block';
        currentPhoneNumber = phoneNumber;
      }
    }
    
    function demoCreateAccount(name, city, dob) {
      const users = JSON.parse(localStorage.getItem('demoUsers') || '{}');
      users[currentPhoneNumber] = { name, city, dob, phone: currentPhoneNumber };
      localStorage.setItem('demoUsers', JSON.stringify(users));
      showDashboard(currentPhoneNumber, { name, city, dob });
    }
    
    // Verify OTP
    if (verifyOtpBtn) {
      verifyOtpBtn.addEventListener('click', async () => {
        const code = otpInput.value.trim();
        if (!code) {
          alert("Please enter OTP");
          return;
        }
        
        if (!firebaseInitialized) {
          // Demo mode - accept any 6-digit OTP
          if (code.length === 6) {
            demoLogin(currentPhoneNumber);
            alert("Demo mode: Login successful!");
          } else {
            alert("Please enter 6-digit OTP");
          }
          return;
        }
        
        showLoader(verifyOtpBtn, true, "Verifying...");
        try {
          const result = await confirmationResult.confirm(code);
          const user = result.user;
          const userDocRef = doc(db, "users", user.uid);
          const docSnap = await getDoc(userDocRef);
          
          if (docSnap.exists()) {
            await showDashboard(user.uid, docSnap.data());
          } else {
            loginCard.style.display = 'none';
            otpCard.style.display = 'none';
            createAccountCard.style.display = 'block';
          }
        } catch (error) {
          alert("Invalid OTP: " + error.message);
        } finally {
          showLoader(verifyOtpBtn, false, "Verify OTP");
        }
      });
    }
    
    // Send OTP with +91 prefix & 10 digit validation
    if (sendOtpBtn) {
      sendOtpBtn.addEventListener('click', async () => {
        let rawPhone = phoneInput.value.trim();
        let digits = rawPhone.replace(/\D/g, '');
        if (digits.length !== 10) {
          alert("Please enter exactly 10 digits (e.g., 9876543210)");
          return;
        }
        const fullNumber = '+91' + digits;
        currentPhoneNumber = fullNumber;
        
        if (!firebaseInitialized) {
          // Demo mode - just show OTP screen
          alert("Demo Mode: OTP would be sent to " + fullNumber + "\nEnter any 6-digit code to continue.");
          loginCard.style.display = 'none';
          otpCard.style.display = 'block';
          return;
        }
        
        showLoader(sendOtpBtn, true, "Sending OTP...");
        try {
          const recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });
          confirmationResult = await signInWithPhoneNumber(auth, fullNumber, recaptchaVerifier);
          alert("OTP sent successfully!");
          loginCard.style.display = 'none';
          otpCard.style.display = 'block';
        } catch (error) {
          let errorMsg = error.message;
          if (error.code === 'auth/api-key-not-valid') {
            errorMsg = "Firebase API Key not configured. Please replace the firebaseConfig with your actual credentials from Firebase Console.";
          }
          alert("Error: " + errorMsg);
        } finally {
          showLoader(sendOtpBtn, false, "Send OTP");
        }
      });
    }
    
    // Create Account
    if (createAccountBtn) {
      createAccountBtn.addEventListener('click', async () => {
        const name = nameInput.value.trim();
        const city = cityInput.value.trim();
        const dob = dobInput.value.trim();
        if (!name || !city || !dob) {
          alert("Please fill all fields");
          return;
        }
        
        if (!firebaseInitialized) {
          demoCreateAccount(name, city, dob);
          return;
        }
        
        showLoader(createAccountBtn, true, "Creating...");
        try {
          const user = auth.currentUser;
          if (!user) throw new Error("No user");
          const userData = { name, city, dob, phone: currentPhoneNumber, createdAt: new Date().toISOString() };
          await setDoc(doc(db, "users", user.uid), userData);
          await showDashboard(user.uid, userData);
        } catch (error) {
          alert("Failed: " + error.message);
        } finally {
          showLoader(createAccountBtn, false, "Create Account");
        }
      });
    }
    
    if (backToLoginBtn) {
      backToLoginBtn.addEventListener('click', () => {
        createAccountCard.style.display = 'none';
        loginCard.style.display = 'block';
        otpCard.style.display = 'none';
        otpInput.value = '';
      });
    }
    
    // Auth State Listener
    if (firebaseInitialized) {
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          const userDocRef = doc(db, "users", user.uid);
          const docSnap = await getDoc(userDocRef);
          if (docSnap.exists() && dashboardContainer.style.display !== 'flex') {
            await showDashboard(user.uid, docSnap.data());
          } else if (!docSnap.exists() && authContainer.style.display !== 'none') {
            if (loginCard.style.display !== 'none') {
              loginCard.style.display = 'none';
              otpCard.style.display = 'none';
              createAccountCard.style.display = 'block';
            }
          }
        } else {
          if (dashboardContainer.style.display === 'flex') dashboardContainer.style.display = 'none';
          authContainer.style.display = 'flex';
          loginCard.style.display = 'block';
          otpCard.style.display = 'none';
          createAccountCard.style.display = 'none';
          phoneInput.value = '';
          otpInput.value = '';
          startAutoScroll(autoScrollDiv);
          bindScrollEvents(autoScrollDiv);
        }
      });
    }
    
    // Initial Splash + start auto-scroll
    setTimeout(() => {
      splashScreen.style.display = 'none';
      authContainer.style.display = 'flex';
      startAutoScroll(autoScrollDiv);
      bindScrollEvents(autoScrollDiv);
    }, 1500);
    
    // Restrict phone input to 10 digits only
    if (phoneInput) {
      phoneInput.addEventListener('input', function(e) {
        this.value = this.value.replace(/\D/g, '').slice(0, 10);
      });
    }
    
    // OTP input restrict to 6 digits
    if (otpInput) {
      otpInput.addEventListener('input', function(e) {
        this.value = this.value.replace(/\D/g, '').slice(0, 6);
      });
    }
  </script>
  
  <style>

      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;

    body {
      font-family: 'Segoe UI', 'Poppins', 'Roboto', sans-serif;
      background: #0a0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    
    /* Mobile container like Android app */
    .app-container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      background: #f8fafc;
      box-shadow: 0 0 40px rgba(0,0,0,0.3);
      overflow: hidden;
      display: flex;

      position: relative;
      border-radius: 0;

    /* Splash Screen with animation */
    #splash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0b3b5f, #1b4f8b);

      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;

    @keyframes fadeOut {

    .splash-title {

      letter-spacing: 2px;

    @keyframes bounceText {
      0% { transform: scale(0.8); opacity: 0; }
      80% { transform: scale(1.1); }

    /* Auth Container - split design with blue top and UPWARD CURVE (convex top of bottom section) */
    #auth-container {
      display: none;

    /* Top half - Blue Gradient Background with curved bottom */

    /* UPWARD CURVE - convex curve at the TOP of bottom section (looks like upside-down curve) */

      flex: 1;
      overflow: hidden;

    /* Shadow and inner curve effect */
    .bottom-half-scroll::before {

      z-index: 2;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.05);

    /* Animated KRISHNA name top center */

    /* Cards Container Inside Top Half */

    }
    .card-glass {
      background: rgba(255,255,255,0.95);

    /* Scroll container */

      margin-top: 8px;
      opacity: 0.85;
      font-size: 0.9rem;

    .dashboard-bottom-scroll {
      flex: 1;
      overflow: hidden;
      padding: 0;
      position: relative;
      border-top-left-radius: 40px;
      border-top-right-radius: 40px;
      margin-top: -8px;
      background: #f1f5f9;
    }
    .dashboard-bottom-scroll::before {
      content: '';
      position: absolute;
      top: -25px;
      left: 0;

      background: #f1f5f9;
      border-radius: 50% 50% 0 0;
      z-index: 2;

    .dashboard-bottom-scroll .scroll-container {
      padding-top: 20px;

    .spinner {
      display: inline-block;
      width: 16px;

      border: 2px solid rgba(255,255,255,0.3);

    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Demo mode badge */

      position: fixed;
      bottom: 5px;

      z-index: 999;

      .brand-name { font-size: 2rem; }

<body>
<div class="app-container">
  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-title">KRISHNA</div>
    <div style="margin-top: 10px; font-size: 0.9rem;">MATKA RESULTS</div>
  </div>
  
  <!-- Authentication Container: Blue top half + scrolling bottom with UPWARD CURVE -->
  <div id="auth-container">
    <!-- Top half: Blue background, KRISHNA animation + forms -->
    <div class="top-half-blue">
      <div class="brand-animation">
        <div class="brand-name">KRISHNA</div>
        <div class="sub-brand">OFFICIAL MATKA</div>
      </div>
      <div class="form-card-wrapper">
        <!-- Login Card (Phone input) -->
        <div id="login-card" class="card-glass">
          <h3>Mobile Login</h3>
          <div class="input-group">
            <label>📞 Phone Number (+91 auto)</label>
            <div class="phone-prefix-wrapper">
              <span class="phone-prefix">+91</span>
              <input type="tel" id="phone-number" placeholder="9876543210" maxlength="10" inputmode="numeric">
            </div>
          </div>
          <button id="send-otp-btn" class="btn-primary">Send OTP</button>
        </div>
        
        <!-- OTP Card -->
        <div id="otp-card" class="card-glass" style="display: none;">
          <h3>Verify OTP</h3>
          <div class="input-group">
            <label>🔐 6-digit Code</label>
            <input type="text" id="otp-code" placeholder="123456" maxlength="6" inputmode="numeric">
          </div>
          <button id="verify-otp-btn" class="btn-primary">Verify & Login</button>
        </div>
        
        <!-- Create Account Card -->
        <div id="create-account-card" class="card-glass" style="display: none;">
          <h3>Create Account</h3>
          <div class="input-group"><label>Full Name</label><input type="text" id="full-name" placeholder="Krishna Kumar"></div>
          <div class="input-group"><label>City</label><input type="text" id="city" placeholder="Mumbai"></div>
          <div class="input-group"><label>Date of Birth</label><input type="date" id="dob"></div>
          <button id="create-account-btn" class="btn-primary">Complete Signup</button>
          <div id="back-to-login" class="text-link">← Back to Login</div>
        </div>
      </div>
    </div>
    
    <!-- Bottom half: AUTO SCROLLING MARKET RESULTS with UPWARD CURVE (convex top) -->
    <div class="bottom-half-scroll">
      <div id="auto-scroll-markets" class="scroll-container"></div>
    </div>
  </div>
  
  <!-- Dashboard Container (after login) -->
  <div id="dashboard-container">
    <div class="dashboard-top-blue">
      <div class="welcome-text" id="user-welcome">Welcome, KRISHNA</div>
      <div class="city-dob-text" id="user-city-dob">City • DOB</div>
    </div>
    <div class="dashboard-bottom-scroll">
      <div id="auto-scroll-markets-dashboard" class="scroll-container"></div>
    </div>
  </div>
  <div id="recaptcha-container"></div>
  <div class="demo-badge">⚡ MATKA APP</div>
</div>
</body>
</html>
